<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexWay Premium — Spline Luxe Typography</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #faf6ef; color: #1a1a1a;
      font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      overflow-x: hidden;
    }
    header.top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 4vw; mix-blend-mode: difference; color: #faf6ef;
      font-size: 0.85rem; letter-spacing: 0.3em; text-transform: uppercase;
    }
    .stage {
      position: relative; width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    spline-viewer { width: 100%; height: 100%; display: block; }
    .brand-label {
      position: absolute; bottom: 8vh; left: 0; right: 0;
      text-align: center; pointer-events: none;
      font-size: clamp(3rem, 9vw, 8rem); font-weight: 400;
      font-style: italic; letter-spacing: -0.02em; line-height: 1;
      color: #1a1a1a; mix-blend-mode: multiply;
    }
    section.intro {
      padding: 12rem 8vw; text-align: center;
    }
    section.intro h2 {
      font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 400;
      max-width: 22ch; margin: 0 auto 2rem; line-height: 1.15;
    }
    .gold { color: #b08d4f; }
  </style>
</head>
<body>
  <header class="top">
    <span>FlexWay</span>
    <nav>Atelier · Lookbook · Contact</nav>
  </header>

  <section class="stage">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@latest/build/spline-viewer.js"></script>
    <spline-viewer url="https://prod.spline.design/KFonZGtsoUXP-qx7/scene.splinecode"></spline-viewer>
    <div class="brand-label">Maison<span class="gold"> · </span>Édition Limitée</div>
  </section>

  <section class="intro">
    <h2>Une collection façonnée à la main, pensée pour celles et ceux qui savent <em>attendre</em>.</h2>
  </section>
</body>
</html>
