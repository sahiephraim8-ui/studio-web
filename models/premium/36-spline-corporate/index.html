<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexWay Premium — Spline Corporate Hero</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0f; color: #f4f4f6; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
    .hero { position: relative; width: 100%; height: 100vh; }
    spline-viewer { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
      padding: 0 8vw; pointer-events: none;
      background: linear-gradient(90deg, rgba(10,10,15,0.65) 0%, rgba(10,10,15,0) 60%);
    }
    .overlay h1 {
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 0 0 1rem;
    }
    .overlay p { font-size: clamp(1rem, 1.4vw, 1.25rem); max-width: 38ch; opacity: 0.85; margin: 0 0 2rem; }
    .cta {
      pointer-events: auto;
      display: inline-block; padding: 1rem 2rem;
      background: #f4f4f6; color: #0a0a0f; border-radius: 999px;
      text-decoration: none; font-weight: 600; transition: transform 0.3s ease;
    }
    .cta:hover { transform: translateY(-3px); }
  </style>
</head>
<body>
  <section class="hero">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@latest/build/spline-viewer.js"></script>
    <spline-viewer url="https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode"></spline-viewer>
    <div class="overlay">
      <h1>L'avenir<br/>se construit<br/>en 3D.</h1>
      <p>FlexWay déploie des expériences web immersives pour les marques tech les plus exigeantes d'Afrique francophone.</p>
      <a href="#contact" class="cta">Démarrer un projet</a>
    </div>
  </section>
</body>
</html>
